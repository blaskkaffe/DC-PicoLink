name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # releases on tags

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe for the version string

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake

      - name: Pico SDK cache
        id: sdk
        uses: actions/cache@v4
        with:
          path: pico-sdk
          key: pico-sdk-2.1.1-tinyusb

      - name: Pico SDK 2.1.1
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b 2.1.1 https://github.com/raspberrypi/pico-sdk.git
          git -C pico-sdk submodule update --init --depth 1 lib/tinyusb

      - name: Host tests
        run: tools/run-tests.sh

      - name: Firmware
        run: |
          export PICO_SDK_PATH=$PWD/pico-sdk
          ver=$(git describe --tags --always --dirty)
          mkdir -p dist
          build() {   # name, cmake options
            cmake -S firmware -B "build-$1" -DPICO_BOARD=pico "${@:2}"
            make -C "build-$1" -j"$(nproc)"
            cp "build-$1/dc_usb_serial.uf2" "dist/dc-picolink-$ver-$1.uf2"
          }
          build 250mhz       -DDC_SYS_KHZ=250000 -DDC_DIAG=0
          build 250mhz-debug -DDC_SYS_KHZ=250000 -DDC_DIAG=1
          build 200mhz-debug -DDC_DIAG=1
          tools/run-tests.sh "$PWD/build-250mhz"
          tools/run-tests.sh "$PWD/build-250mhz-debug"
          tools/make-dreampi-setup.sh dist/dc-picolink-dreampi-setup.sh
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dc-picolink
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "DC-PicoLink $GITHUB_REF_NAME" --generate-notes
