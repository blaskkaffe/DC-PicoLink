name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:        # Actions tab -> build -> Run workflow (any branch)

permissions:
  contents: write   # releases on tags

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe for the version string

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake

      - name: Pico SDK cache
        id: sdk
        uses: actions/cache@v4
        with:
          path: pico-sdk
          key: pico-sdk-2.1.1-tinyusb

      - name: Pico SDK 2.1.1
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b 2.1.1 https://github.com/raspberrypi/pico-sdk.git
          git -C pico-sdk submodule update --init --depth 1 lib/tinyusb

      - name: Host tests
        run: tools/run-tests.sh

      - name: Firmware
        run: |
          export PICO_SDK_PATH=$PWD/pico-sdk
          ver=$(git describe --tags --always --dirty)
          mkdir -p dist
          build() {   # name, cmake options
            cmake -S firmware -B "build-$1" -DPICO_BOARD=pico "${@:2}"
            make -C "build-$1" -j"$(nproc)"
            cp "build-$1/dc_usb_serial.uf2" "dist/dc-picolink-$ver-$1.uf2"
          }
          build 250mhz       -DDC_SYS_KHZ=250000 -DDC_DIAG=0
          build 250mhz-debug -DDC_SYS_KHZ=250000 -DDC_DIAG=1
          build 200mhz-debug -DDC_DIAG=1
          tools/run-tests.sh "$PWD/build-250mhz"
          tools/run-tests.sh "$PWD/build-250mhz-debug"
          tools/make-dreampi-setup.sh dist/dc-picolink-dreampi-setup.sh
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dc-picolink
          path: dist/*

  # The Dreamcast test program: needs the KallistiOS toolchain, taken from the image KOS itself
  # publishes for its CI (Docker Hub: pcercuei/dreamcast-toolchain). KOS is pinned so a build
  # is reproducible; bump the ref when you want a newer KOS.
  dctest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: KallistiOS/KallistiOS
          ref: 368a2eb9584a7d130a6e77e299468c0b64fa1a9f
          path: kos

      - name: Build dctest.elf
        run: |
          ver=$(git describe --tags --always --dirty)
          docker run --rm -v "$PWD":/work -w /work pcercuei/dreamcast-toolchain:stable \
            bash tools/dctest/ci-build.sh /work/kos /work/dist-dctest "$ver"
          sudo chown -R "$(id -u):$(id -g)" dist-dctest

      # A bootable disc image (CDI) for ODE/SD loaders and emulators, from the same ELF. A console
      # that boots it does not need dc-tool at all. Failure here does not stop the ELF being published.
      - name: CDI image
        continue-on-error: true
        run: |
          ver=$(git describe --tags --always --dirty)
          sudo apt-get install -y meson ninja-build pkg-config libisofs-dev binutils-sh-elf
          git clone https://github.com/Nold360/mkdcdisc.git
          meson setup mkdcdisc/build mkdcdisc && ninja -C mkdcdisc/build
          mkdcdisc/build/mkdcdisc -e dist-dctest/dctest-$ver.elf -o dist-dctest/dctest-$ver.cdi -n "DCTEST"
          ls -l dist-dctest

      - uses: actions/upload-artifact@v4
        with:
          name: dctest
          path: dist-dctest/*

  release:
    needs: [build, dctest]
    # the firmware release goes out even if the KOS build breaks; dctest.elf is added when it worked
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "DC-PicoLink $GITHUB_REF_NAME" --generate-notes
