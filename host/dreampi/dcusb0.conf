# Settings for the Dreamcast USB network (dcusb0). Edit, then: sudo systemctl restart dcusb0
PI_ADDR=192.168.99.1
PREFIX=24
SUBNET=192.168.99.0/24
DHCP_START=192.168.99.10
DHCP_END=192.168.99.50
# DNS server handed to the Dreamcast. 46.101.91.123 is the Dreamcast community DNS
# (as used by DreamPi): it resolves the games' master/login servers.
# Empty = first non-local nameserver in /etc/resolv.conf
DNS=46.101.91.123
# Dreamcast Live VPN: give the W5500 Dreamcast its own VPN address (the Pi's
# VPN address + 1, as DreamPi does for a modem Dreamcast), all ports both ways,
# so other players and servers can reach it (AFO, Worms, Quake 3, UT...).
# Then: sudo systemctl restart dcusb0-vpn
VPN_MAP=yes
VPN_IF=tun0
