# Settings for the Dreamcast USB network (dcusb0). Edit, then: sudo systemctl restart dcusb0
PI_ADDR=192.168.99.1
PREFIX=24
SUBNET=192.168.99.0/24
DHCP_START=192.168.99.10
DHCP_END=192.168.99.50
# DNS server handed to the Dreamcast. auto = the same as DreamPi gives a modem Dreamcast
# (DreamPi's dnsmasq on this Pi: community DNS 46.101.91.123 and 209.50.50.129 plus
# DreamPi's own overrides), or 46.101.91.123 if no DNS server answers on this Pi.
# An address = that server. Empty = first non-local nameserver in /etc/resolv.conf
DNS=auto
# Dreamcast Live VPN: give the W5500 Dreamcast its own VPN address (the Pi's
# VPN address + 1, as DreamPi does for a modem Dreamcast), all ports both ways,
# so other players and servers can reach it (AFO, Worms, Quake 3, UT...).
# Then: sudo systemctl restart dcusb0-vpn
VPN_MAP=yes
VPN_IF=tun0
# Which of the Dreamcast's traffic goes through the VPN (tun0), with the VPN address
# above as its source: "all" (everything, if the VPN server forwards to the Internet:
# checked with a ping through tun0; if not, only VPN addresses), a list of addresses
# or networks ("20.102.63.253 192.246.40.56/32"), or "none". When the VPN is down the
# Dreamcast uses the LAN as before.
VPN_ROUTE=all
# The W5500 Dreamcast's own LAN address, as DreamPi gives a modem Dreamcast: "auto" = the
# one DreamPi chose (from /etc/ppp/options, e.g. 192.168.1.98), so the router sees one
# Dreamcast address and its UPnP forwards (AFO, Worms, ChuChu...) reach the W5500 Dreamcast
# too; an address; or "none" (Internet traffic uses the Pi's address).
LAN_ALIAS=auto
# Quake 3 Arena: its master (MASTER_ADDR) ignores the Dreamcast's query word
# "dreamcast"; a small relay on the Pi removes it so the server list shows up
# (W5500 on dcusb0, serial/modem PPP on ppp0).
# Then: sudo systemctl restart dcusb0-masterfix
MASTER_FIX=yes
MASTER_ADDR=20.102.63.253
MASTER_IFACES="dcusb0 ppp0"
